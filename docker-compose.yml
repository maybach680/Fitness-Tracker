version: '3.8'

services:
  # Backend сервис на FastAPI с SQLite базой данных
  backend:
    build: ./backend
    container_name: calorie-tracker-backend
    restart: unless-stopped
    volumes:
      # Сохраняем базу данных между перезапусками контейнера
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/tracker.db
      - OPENFOODFACTS_API=https://world.openfoodfacts.org
    networks:
      - tracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend сервис на Vue 3 + Vite
  frontend:
    build: ./frontend
    container_name: calorie-tracker-frontend
    restart: unless-stopped
    ports:
      - "8080:80"  # Доступ к приложению по http://localhost:8080
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tracker-network

# Сеть для изоляции сервисов
networks:
  tracker-network:
    driver: bridge

